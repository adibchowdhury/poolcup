<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PoolCup</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #0b1220;
        color: #e8eef9;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .badge { font-size: 56px; margin-bottom: 16px; }
      h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
      p { margin-top: 8px; color: #8aa0c4; font-size: 15px; }
      .pill {
        margin-top: 28px;
        font-size: 13px;
        color: #5ee0a0;
        border: 1px solid #1c3a2e;
        background: #0f2018;
        padding: 8px 14px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="badge">🏆</div>
    <h1>PoolCup</h1>
    <p>World Cup 2026 prediction pools</p>
    <div class="pill">App running its own local code</div>
  </body>
</html>
